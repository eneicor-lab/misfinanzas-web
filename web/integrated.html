<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self' https://yjzgpspxvmimduuemxms.supabase.co; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>MisFinanzas</title><link rel="icon" href="brand-icon.png"><link rel="stylesheet" href="integrated.css">
<script defer src="finance-safety.js"></script><script defer src="domain.js"></script><script defer src="unified-ledger.js"></script><script defer src="schedule-engine.js"></script><script defer src="preferences.js"></script><script defer src="planning.js"></script><script defer src="book-sync.js"></script><script defer src="module-sync.js"></script><script defer src="session-client.js"></script><script defer src="deployment-config.js"></script><script defer src="native-reminders.js"></script><script type="module" src="integrated.js"></script></head>
<body><section id="access" class="access"><img class="logo" src="brand-icon.png" alt="MisFinanzas"><h1>MisFinanzas</h1><p>Tu información financiera, en un solo lugar.</p><form id="loginForm"><label>Correo<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><label id="localKeyLabel" hidden>Clave de protección de este dispositivo<input id="localKey" type="password" autocomplete="off" maxlength="1024"><small>Solo si la copia cifrada existente utiliza una clave diferente.</small></label><div class="actions"><button id="signIn">Iniciar sesión</button><button type="button" id="recover" class="secondary">Recuperar acceso</button></div></form><p id="accessStatus" role="status" aria-live="polite"></p><footer>Creado por: Eduardo Neisa Cortés</footer></section>
<div id="application" hidden><header><div class="identity"><img src="brand-icon.png" alt=""><strong>MisFinanzas</strong></div><details id="userMenu"><summary id="userIdentity">Mi cuenta</summary><div class="menu"><button data-view="profile">Mi perfil</button><button data-view="preferences">Preferencias</button><button data-view="security">Seguridad y acceso</button><button data-view="notifications">Notificaciones</button><button data-view="help">Ayuda</button><button data-view="about">Acerca de</button><div id="releaseMenu"></div><button id="lockApp">Bloquear aplicación</button><button id="signOut">Cerrar sesión</button></div></details></header><div id="connection" role="status"></div><div class="layout"><nav aria-label="Navegación principal" id="navigation"></nav><main class="workspace"><h1 id="pageTitle">Panorama financiero</h1><p id="toast" role="status" aria-live="polite"></p><div id="content"></div></main></div><footer>Creado por: Eduardo Neisa Cortés</footer></div>
<dialog id="editDialog"><form id="editForm"><h2 id="editTitle"></h2><div id="editFields" class="form-grid"></div><p id="editError" class="error" role="alert"></p><div class="actions"><button id="saveRecord">Guardar</button><button id="cancelEdit" type="button" class="secondary">Cancelar</button></div></form></dialog>
<dialog id="lockDialog"><h2>Aplicación bloqueada</h2><p>La sesión remota permanece protegida. Desbloquea este dispositivo para continuar.</p><form id="unlockForm"><label>Clave de protección local<input id="unlockKey" type="password" required autocomplete="current-password"></label><button>Desbloquear</button><p id="unlockError" role="alert"></p></form></dialog>
</body></html>
