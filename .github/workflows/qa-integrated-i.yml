name: MisFinanzas integrated interface affected QA
on:
  push:
    branches: [integration/misfinanzas-2.7.1]
    paths: ['web/**', 'tests/browser/integrated-i.spec.cjs', 'playwright.integrated.config.cjs', '.github/workflows/qa-integrated-i.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affected-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.integrated.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-interface-${{ github.sha }}
          path: |
            evidence/
            test-results/
