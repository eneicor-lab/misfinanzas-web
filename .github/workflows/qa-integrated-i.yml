name: MisFinanzas integrated interface affected QA
on:
  push:
    branches: [integration/misfinanzas-2.7.1]
    paths: ['web/**', 'tests/browser/integrated*.spec.cjs', 'tests/seed-ui-auth.cjs', 'tests/database/run-integrated-real-i.sh', 'playwright.integrated.config.cjs', '.github/workflows/qa-integrated-i.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affected-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/vault-rekey-i.test.cjs
      - run: node tests/opening-correction-i.test.cjs
      - run: npx playwright test --config=playwright.integrated.config.cjs --grep-invert 'real isolated'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-interface-${{ github.sha }}
          path: |
            evidence/
            test-results/

  real-auth-finance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-auth-db-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports: ['1025:1025','8025:8025']
    env:
      PGPASSWORD: synthetic-auth-db-only
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:synthetic-auth-db-only@localhost:5432/postgres
      DB_NAMESPACE: auth
      GOTRUE_DB_MIGRATIONS_PATH: ${{ github.workspace }}/.qa/auth-source/migrations
      GOTRUE_API_HOST: 127.0.0.1
      GOTRUE_API_PORT: '9999'
      PORT: '9999'
      API_EXTERNAL_URL: http://127.0.0.1:9999
      GOTRUE_SITE_URL: http://127.0.0.1:8765
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:8765/**
      GOTRUE_JWT_SECRET: synthetic-auth-service-secret-not-for-production-1234567890
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: '1025'
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@example.invalid
      GOTRUE_SMTP_SENDER_NAME: MisFinanzas QA
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '1000'
      GOTRUE_PASSWORD_MIN_LENGTH: '12'
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: 'abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789:!@#$%^&*()_+-=[]{};,.?/'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: supabase/auth
          ref: 0725a1d90cd9fbbb2a26f3baf18afd400a436f66
          path: .qa/auth-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Exercise integrated UI with real isolated services
        env:
          MF_QA_CONTAINER: ${{ job.services.postgres.id }}
          MF_PRIVATE_RELEASE_QA: ${{ secrets.MF_PRIVATE_RELEASE_QA }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mf-auth /tmp/mf-postgrest evidence
          curl --fail --location --silent --show-error https://github.com/supabase/auth/releases/download/v2.199.0/auth-v2.199.0-amd64.tar.xz -o /tmp/mf-auth/auth.tar.xz
          echo '056ed85d91c2077746fbf639e19ffdd557460c561139dada217f9560606d6852  /tmp/mf-auth/auth.tar.xz' | sha256sum -c -
          tar -xJf /tmp/mf-auth/auth.tar.xz -C /tmp/mf-auth
          curl --fail --location --silent --show-error https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz -o /tmp/mf-postgrest/postgrest.tar.xz
          tar -xJf /tmp/mf-postgrest/postgrest.tar.xz -C /tmp/mf-postgrest
          bash tests/database/run-integrated-real-i.sh 2>&1 | tee evidence/integrated-real-ui.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-real-services-${{ github.sha }}
          path: |
            evidence/
            test-results/
