name: Focused private release transition QA
on:
  workflow_dispatch:
  push:
    branches: [integration/misfinanzas-2.7-rc2]
    paths: ['.github/workflows/qa-release-transition.yml','tests/browser/private-release.spec.cjs','tests/release-transition.test.cjs','web/release-transition.js','web/private-vault.js','web/supabase-dev.html']
permissions:
  contents: read
concurrency:
  group: private-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/private-release.spec.cjs --project=private-desktop --project=private-mobile
      - name: Preserve synthetic failure traces and focused results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-release-${{ github.sha }}
          path: |
            evidence/playwright.json
            playwright-report/
            test-results/
          retention-days: 14
