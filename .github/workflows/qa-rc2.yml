name: MisFinanzas RC2 isolated QA and Android
on:
  push:
    branches: [integration/misfinanzas-2.7-rc2]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rc2-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p evidence && npm test 2>&1 | tee evidence/node.log
      - run: python -m unittest discover -s tests -v 2>&1 | tee evidence/python.log
      - run: python tests/check_candidate.py 2>&1 | tee evidence/candidate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ github.sha }}
          path: evidence/
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            evidence/playwright.json
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify asset parity and APK integrity
        run: |
          for f in index.html supabase-dev.html finance-safety.js schedule-engine.js; do cmp "web/$f" "android/app/src/main/assets/$f"; done
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/MisFinanzas-2.7.0-rc2-debug.apk
          printf '%s\n' '${{ github.sha }}' > artifacts/COMMIT.txt
          cd artifacts && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-rc2-${{ github.sha }}
          path: artifacts/
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: misfinanzas_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: synthetic_ci_only
      PGDATABASE: misfinanzas_qa
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p evidence
          psql -v ON_ERROR_STOP=1 -f tests/database/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f sql/001_ledger_isolated.sql
          psql -v ON_ERROR_STOP=1 -f tests/database/ledger.sql 2>&1 | tee evidence/database.log
          python3 tests/database/concurrency.py 2>&1 | tee -a evidence/database.log
      - name: Restore synthetic database into an isolated database
        run: |
          pg_dump --no-owner --no-acl > evidence/synthetic.sql
          createdb misfinanzas_restore_qa
          PGDATABASE=misfinanzas_restore_qa psql -v ON_ERROR_STOP=1 -f evidence/synthetic.sql > evidence/restore.log
          psql -Atc "SELECT jsonb_agg(to_jsonb(t) ORDER BY id) FROM mf_next.movements t" > evidence/before.json
          PGDATABASE=misfinanzas_restore_qa psql -Atc "SELECT jsonb_agg(to_jsonb(t) ORDER BY id) FROM mf_next.movements t" > evidence/after.json
          cmp evidence/before.json evidence/after.json
          printf '%s\n' 'PASS synthetic dump/restore exact movements comparison' >> evidence/restore.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-${{ github.sha }}
          path: |
            evidence/database.log
            evidence/restore.log
