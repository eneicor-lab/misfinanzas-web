name: MisFinanzas RC2 isolated QA and Android
on:
  push:
    branches: [integration/misfinanzas-2.7-rc2]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rc2-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    if: ${{ !contains(github.event.head_commit.message, '[backup-only]') && !contains(github.event.head_commit.message, '[package-only]') && !contains(github.event.head_commit.message, '[repair-only]') && !contains(github.event.head_commit.message, '[browser-only]') && !contains(github.event.head_commit.message, '[database-only]') && !contains(github.event.head_commit.message, '[ui-only]') && !contains(github.event.head_commit.message, '[android-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p evidence && npm test 2>&1 | tee evidence/node.log
      - run: node tests/reminder-compatibility.test.cjs 2>&1 | tee evidence/reminder-compatibility.log
      - run: node tests/reminder-compatibility.test.cjs 2>&1 | tee evidence/reminder-compatibility.log
      - run: python -m unittest discover -s tests -v 2>&1 | tee evidence/python.log
      - run: python tests/check_candidate.py 2>&1 | tee evidence/candidate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ github.sha }}
          path: evidence/
  browser:
    if: ${{ !contains(github.event.head_commit.message, '[backup-only]') && !contains(github.event.head_commit.message, '[package-only]') && !contains(github.event.head_commit.message, '[database-only]') && !contains(github.event.head_commit.message, '[android-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run affected browser scope
        env:
          MF_QA_SCOPE: ${{ (contains(github.event.head_commit.message, '[ui-only]') || contains(github.event.head_commit.message, '[client-only]')) && 'unified-ui' || (contains(github.event.head_commit.message, '[sync-only]') || contains(github.event.head_commit.message, '[repair-only]')) && 'sync' || contains(github.event.head_commit.message, '[browser-only]') && 'browser-login' || 'full' }}
        run: |
          if [[ "$MF_QA_SCOPE" == 'unified-ui' ]]; then
            npx playwright test tests/browser/app.spec.cjs tests/browser/products.spec.cjs tests/browser/planning.spec.cjs tests/browser/unified-ledger.spec.cjs tests/browser/book-sync.spec.cjs tests/browser/module-sync.spec.cjs tests/browser/recurrence.spec.cjs tests/browser/module-sync.spec.cjs tests/browser/recurrence.spec.cjs
          elif [[ "$MF_QA_SCOPE" == 'sync' ]]; then
            npx playwright test tests/browser/module-sync.spec.cjs tests/browser/book-sync.spec.cjs
          elif [[ "$MF_QA_SCOPE" == 'browser-login' ]]; then
            npx playwright test tests/browser/app.spec.cjs --project=mobile --grep 'mock authentication'
          else
            npm run test:browser
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            evidence/playwright.json
  android:
    if: ${{ !contains(github.event.head_commit.message, '[backup-only]') && !contains(github.event.head_commit.message, '[package-only]') && !contains(github.event.head_commit.message, '[browser-only]') && !contains(github.event.head_commit.message, '[database-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify asset parity and APK integrity
        run: |
          for f in index.html supabase-dev.html finance-safety.js schedule-engine.js planning.js module-sync.js auth-recovery.js unified-ledger.js unified-ui.js book-sync.js book-session.js book-sync-ui.js; do cmp "web/$f" "android/app/src/main/assets/$f"; done
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/MisFinanzas-2.7.0-rc2-debug.apk
          printf '%s\n' '${{ github.sha }}' > artifacts/COMMIT.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging artifacts/*.apk > artifacts/apk-badging.txt
          grep -F 'co.misfinanzas.dev' artifacts/apk-badging.txt
          grep -F 'MisFinanzas' artifacts/apk-badging.txt
          for f in index.html supabase-dev.html finance-safety.js schedule-engine.js planning.js module-sync.js auth-recovery.js unified-ledger.js unified-ui.js book-sync.js book-session.js book-sync-ui.js; do unzip -p artifacts/*.apk "assets/$f" | cmp - "web/$f"; done
          sha256sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png > artifacts/icon-source-sha256.txt
          cd artifacts && sha256sum *.apk | tee SHA256SUMS.txt
      - name: Enable KVM for isolated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r artifacts/MisFinanzas-2.7.0-rc2-debug.apk
            adb shell am start -W -n co.misfinanzas.dev/.MainActivity
            sleep 5
            adb shell pidof co.misfinanzas.dev > artifacts/android-pid.txt
            adb exec-out screencap -p > artifacts/android-screen.png
            for attempt in $(seq 1 15); do if adb logcat -d -s MisFinanzasQA:I | grep -q 'web_ready=true'; then break; fi; sleep 2; done
            adb logcat -d -s MisFinanzasQA:I AndroidRuntime:E > artifacts/android-runtime.log
            grep -q 'web_ready=true' artifacts/android-runtime.log
            grep -F 'web_ready=' artifacts/android-runtime.log
            test -s artifacts/android-pid.txt
            if grep -q 'FATAL EXCEPTION' artifacts/android-runtime.log; then exit 1; fi
            adb shell uiautomator dump /sdcard/window.xml || true
            if adb shell test -f /sdcard/window.xml; then adb pull /sdcard/window.xml artifacts/android-window.xml; else printf '%s\n' 'UI hierarchy unavailable; installation, activity startup and PID verified separately' > artifacts/android-hierarchy-limitation.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-rc2-${{ github.sha }}
          path: artifacts/
  database:
    if: ${{ !contains(github.event.head_commit.message, '[backup-only]') && !contains(github.event.head_commit.message, '[package-only]') && !contains(github.event.head_commit.message, '[browser-only]') && !contains(github.event.head_commit.message, '[ui-only]') && !contains(github.event.head_commit.message, '[android-only]') && !contains(github.event.head_commit.message, '[client-only]') }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: misfinanzas_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: synthetic_ci_only
      PGDATABASE: misfinanzas_qa
      MF_PREFLIGHT_ONLY: ${{ contains(github.event.head_commit.message, '[preflight-only]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated database scope
        run: |
          if [[ "$MF_PREFLIGHT_ONLY" == 'true' ]]; then
            mkdir -p evidence
            psql -v ON_ERROR_STOP=1 -f tests/database/bootstrap.sql
            psql -v ON_ERROR_STOP=1 -f sql/001_ledger_isolated.sql
            psql -v ON_ERROR_STOP=1 -f sql/004_module_state.sql
            psql -v ON_ERROR_STOP=1 -f sql/006_book_state.sql
            psql -v ON_ERROR_STOP=1 -f sql/006b_book_replay.sql
            before=$(psql -qAtc "SELECT md5(coalesce(jsonb_agg(to_jsonb(t) ORDER BY id)::text,'')) FROM auth.users t")
            PGOPTIONS='-c default_transaction_read_only=on' psql -v ON_ERROR_STOP=1 -f sql/PRECHECK_SUPABASE_READ_ONLY.sql 2>&1 | tee evidence/preflight.log
            after=$(psql -qAtc "SELECT md5(coalesce(jsonb_agg(to_jsonb(t) ORDER BY id)::text,'')) FROM auth.users t")
            test "$before" = "$after"
            printf '%s\n' 'PASS complete preflight under enforced read-only transaction; synthetic Auth contents unchanged' >> evidence/preflight.log
          else
            mkdir -p evidence
            psql -v ON_ERROR_STOP=1 -f tests/database/bootstrap.sql
            psql -v ON_ERROR_STOP=1 -f sql/001_ledger_isolated.sql
            psql -v ON_ERROR_STOP=1 -f sql/004_module_state.sql
            psql -v ON_ERROR_STOP=1 -f tests/database/ledger.sql 2>&1 | tee evidence/database.log
            psql -v ON_ERROR_STOP=1 -f tests/database/module_state.sql 2>&1 | tee -a evidence/database.log
            python3 tests/database/concurrency.py 2>&1 | tee -a evidence/database.log
            psql -v ON_ERROR_STOP=1 -f sql/006_book_state.sql
            psql -v ON_ERROR_STOP=1 -f sql/006b_book_replay.sql
            node tests/make-book-fixture.cjs
            psql -v ON_ERROR_STOP=1 -v book_fixture="$(cat evidence/book-book.json)" -v next_fixture="$(cat evidence/book-next.json)" -v fresh_fixture="$(cat evidence/book-fresh.json)" -f tests/database/book_state.sql 2>&1 | tee -a evidence/database.log
          fi
      - name: Exercise real HTTP book persistence in isolated PostgREST
        if: ${{ !contains(github.event.head_commit.message, '[backup-only]') && !contains(github.event.head_commit.message, '[preflight-only]') }}
        timeout-minutes: 3
        run: |
          mkdir -p /tmp/mf-postgrest
          curl -fL --connect-timeout 10 --max-time 60 'https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz' -o /tmp/mf-postgrest/postgrest.tar.xz
          tar -xJf /tmp/mf-postgrest/postgrest.tar.xz -C /tmp/mf-postgrest
          export PGRST_DB_URI=postgres://postgres:synthetic_ci_only@127.0.0.1:5432/misfinanzas_qa PGRST_DB_SCHEMAS=mf_next PGRST_DB_ANON_ROLE=anon PGRST_JWT_SECRET=synthetic_postgrest_ci_signing_key_never_production_2026 PGRST_SERVER_PORT=3001 PGRST_SERVER_HOST=127.0.0.1
          /tmp/mf-postgrest/postgrest > evidence/postgrest.log 2>&1 &
          postgrest_pid=$!
          trap 'result=$?; kill "$postgrest_pid" 2>/dev/null || true; tail -n 30 evidence/postgrest.log; exit "$result"' EXIT
          node tests/database/book-http.cjs 2>&1 | tee evidence/book-http.log
      - name: Restore synthetic database into an isolated database
        if: ${{ !contains(github.event.head_commit.message, '[backup-only]') && !contains(github.event.head_commit.message, '[preflight-only]') }}
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/database/restore-fixtures.sql
          psql -v ON_ERROR_STOP=1 -f tests/database/acl.sql > evidence/acl-before.csv
          docker exec '${{ job.services.postgres.id }}' pg_dump -U postgres -d misfinanzas_qa --no-owner > evidence/synthetic.sql
          docker exec '${{ job.services.postgres.id }}' createdb -U postgres misfinanzas_restore_qa
          docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d misfinanzas_restore_qa -v ON_ERROR_STOP=1 < evidence/synthetic.sql > evidence/restore.log
          psql -Atc "SELECT jsonb_agg(to_jsonb(t) ORDER BY id) FROM mf_next.movements t" > evidence/before.json
          PGDATABASE=misfinanzas_restore_qa psql -Atc "SELECT jsonb_agg(to_jsonb(t) ORDER BY id) FROM mf_next.movements t" > evidence/after.json
          cmp evidence/before.json evidence/after.json
          psql -Atc "SELECT jsonb_agg(to_jsonb(t) ORDER BY owner_id,module) FROM mf_next.module_state t" > evidence/modules-before.json
          PGDATABASE=misfinanzas_restore_qa psql -Atc "SELECT jsonb_agg(to_jsonb(t) ORDER BY owner_id,module) FROM mf_next.module_state t" > evidence/modules-after.json
          cmp evidence/modules-before.json evidence/modules-after.json
          PGDATABASE=misfinanzas_restore_qa psql -v ON_ERROR_STOP=1 -f tests/database/acl.sql > evidence/acl-after.csv
          cmp evidence/acl-before.csv evidence/acl-after.csv
          PGDATABASE=misfinanzas_restore_qa psql -v ON_ERROR_STOP=1 -f tests/database/post-restore.sql 2>&1 | tee -a evidence/restore.log
          printf '%s\n' 'PASS synthetic dump/restore exact movements comparison' >> evidence/restore.log
          printf '%s\n' 'PASS original synthetic ACL comparison including grants and grantors' >> evidence/restore.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-${{ github.sha }}
          path: |
            evidence/preflight.log
            evidence/postgrest.log
            evidence/book-http.log
            evidence/database.log
            evidence/restore.log
            evidence/acl-before.csv
            evidence/acl-after.csv

  source:
    if: ${{ !contains(github.event.head_commit.message, '[client-only]') && !contains(github.event.head_commit.message, '[client-only]') && !contains(github.event.head_commit.message, '[backup-only]') && !contains(github.event.head_commit.message, '[browser-only]') && !contains(github.event.head_commit.message, '[database-only]') && !contains(github.event.head_commit.message, '[android-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git fetch --depth=1 origin 2a7e40e8cdae998abc8a15cee42ce7160684c08b
      - run: python tools/package-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: |
            artifacts/*-source.zip
            artifacts/*-web.zip
            artifacts/MANIFIESTO_SHA256.json
            artifacts/SOURCE_COMMIT.txt
            artifacts/APK_APP_PARITY.txt
            artifacts/SOURCE_SHA256SUMS.txt

