name: Verificar Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Preparar PostgreSQL
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y postgresql-client
          fi
          psql --version

      - name: Verificar conexion
        env:
          PGHOST: aws-0-sa-east-1.pooler.supabase.com
          PGPORT: "6543"
          PGUSER: postgres.yjzgpspxvmimduuemxms
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "15"
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "ERROR: Secreto no configurado."
            exit 1
          fi

          psql -X -v ON_ERROR_STOP=1 \
            -c "BEGIN READ ONLY; SELECT 1 AS conexion_ok; ROLLBACK;"

          echo "EXITO: Conexion con Supabase verificada."
