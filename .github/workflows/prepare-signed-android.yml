name: Prepare stable signed MisFinanzas APK
on:
  workflow_dispatch:
  push:
    branches: [integration/misfinanzas-2.7-rc2]
    paths: ['.github/workflows/prepare-signed-android.yml','tools/private_drive.py']
permissions:
  contents: read
concurrency:
  group: misfinanzas-private-signing
  cancel-in-progress: false
jobs:
  signed-apk:
    if: github.ref == 'refs/heads/integration/misfinanzas-2.7-rc2'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover existing private signing identity before considering generation
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mf-signing"
          python tools/private_drive.py get-or-create-signing "$RUNNER_TEMP/mf-signing/identity.tar.gz.gpg" "$RUNNER_TEMP/mf-signing/receipt.json"
      - name: Create a new identity only if absent, encrypt with existing protected backup key
        env:
          BACKUP_KEY: ${{ secrets.MF_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -f "$RUNNER_TEMP/mf-signing/identity.tar.gz.gpg" ]]; then exit 0; fi
          test "${#BACKUP_KEY}" -ge 32 || { echo 'Protected backup encryption key is missing or too short; no signing identity generated.'; exit 1; }
          dir="$RUNNER_TEMP/mf-signing/generated"
          mkdir -p "$dir"
          openssl rand -hex 32 > "$dir/store.password"
          keytool -genkeypair -alias misfinanzas -keyalg RSA -keysize 3072 -validity 10000 -storetype PKCS12 -keystore "$dir/misfinanzas-release.p12" -storepass:file "$dir/store.password" -keypass:file "$dir/store.password" -dname 'CN=MisFinanzas Personal'
          keytool -exportcert -alias misfinanzas -keystore "$dir/misfinanzas-release.p12" -storepass:file "$dir/store.password" -file "$dir/certificate.der"
          (cd "$dir" && sha256sum certificate.der > CERTIFICATE_SHA256.txt && tar -czf "$RUNNER_TEMP/mf-signing/identity.tar.gz" misfinanzas-release.p12 store.password certificate.der CERTIFICATE_SHA256.txt)
          printf '%s' "$BACKUP_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/mf-signing/identity.tar.gz.gpg" "$RUNNER_TEMP/mf-signing/identity.tar.gz"
      - name: Preserve encrypted identity privately and verify a fresh readback
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python tools/private_drive.py get-or-create-signing "$RUNNER_TEMP/mf-signing/identity.tar.gz.gpg" "$RUNNER_TEMP/mf-signing/receipt.json"
          python - <<'PY'
          from pathlib import Path
          import os
          Path(os.environ['RUNNER_TEMP'],'mf-signing/identity.tar.gz.gpg').unlink()
          PY
          python tools/private_drive.py get-or-create-signing "$RUNNER_TEMP/mf-signing/identity.tar.gz.gpg" "$RUNNER_TEMP/mf-signing/recovered-receipt.json"
      - name: Decrypt recovered identity for this build only
        env:
          BACKUP_KEY: ${{ secrets.MF_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test "${#BACKUP_KEY}" -ge 32
          mkdir "$RUNNER_TEMP/mf-signing/restored"
          printf '%s' "$BACKUP_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --output "$RUNNER_TEMP/mf-signing/recovered.tar.gz" --decrypt "$RUNNER_TEMP/mf-signing/identity.tar.gz.gpg"
          tar -xzf "$RUNNER_TEMP/mf-signing/recovered.tar.gz" -C "$RUNNER_TEMP/mf-signing/restored"
          (cd "$RUNNER_TEMP/mf-signing/restored" && sha256sum -c CERTIFICATE_SHA256.txt)
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Compile signed release without changing production or installing over an existing app
        env:
          MF_ANDROID_SIGNING_DIR: ${{ runner.temp }}/mf-signing/restored
        run: |
          set -euo pipefail
          gradle -p android :app:assembleRelease --no-daemon --no-configuration-cache
          node tools/check-assets.cjs
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/MisFinanzas-2.7.0-rc2-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifacts/*.apk > artifacts/SIGNATURE.txt
          expected=$(cut -d' ' -f1 "$RUNNER_TEMP/mf-signing/restored/CERTIFICATE_SHA256.txt")
          grep -Fi "$expected" artifacts/SIGNATURE.txt
          while IFS= read -r f; do unzip -p artifacts/*.apk "assets/${f#web/}" | cmp - "$f"; done < <(find web -type f | sort)
          printf '%s\n' '${{ github.sha }}' > artifacts/COMMIT.txt
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt
          printf '%s\n' 'Stable signing identity recovered from encrypted owner-only Drive storage; original bank icon retained.' 'Candidate only: this artifact does not certify production, migration approval or remote financial writes.' 'Installing over historical debug APKs requires their matching signer; never uninstall or discard existing data automatically.' > artifacts/STATUS.txt
      - name: Enable KVM for release installation QA
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python tools/qa_signed_android.py
      - name: Preserve APK and public certificate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-${{ github.sha }}
          path: artifacts/
          retention-days: 90
      - name: Remove ephemeral private signing material
        if: always()
        run: |
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']).resolve()
          target=(root/'mf-signing').resolve()
          if target.parent!=root:raise RuntimeError('Unexpected signing cleanup target')
          if target.exists():shutil.rmtree(target)
          PY
