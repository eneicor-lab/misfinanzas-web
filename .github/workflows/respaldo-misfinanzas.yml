
name: Respaldo MisFinanzas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [integration/misfinanzas-2.7-rc2]
    paths: ['.github/workflows/respaldo-misfinanzas.yml']

permissions:
  contents: read

concurrency:
  group: respaldo-misfinanzas
  cancel-in-progress: false

jobs:
  respaldo:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[backup-candidate-verify]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: temporal_qa
          POSTGRES_DB: mf_recovery
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Preparar entorno
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mf_backup"
          echo "OK: Entorno temporal preparado."

      - name: Generar respaldo estructural y huellas
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
          PGHOST: aws-0-sa-east-1.pooler.supabase.com
          PGPORT: "5432"
          PGUSER: mf_backup.yjzgpspxvmimduuemxms
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: /tmp/mf-supabase-root.crt
          PGCONNECT_TIMEOUT: "15"
        run: |
          set -euo pipefail
          umask 077

          DIR="$RUNNER_TEMP/mf_backup"
          FILE="$DIR/MisFinanzas_$(date -u +%Y%m%dT%H%M%SZ).dump"

          python3 <<'PY'
          import os
          import subprocess
          from pathlib import Path

          cid = os.environ["CONTAINER_ID"]
          import hashlib
          ca=Path("sql/certs/supabase-root.crt").read_bytes()
          if hashlib.sha256(ca).hexdigest()!="700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7":raise RuntimeError("Reviewed CA mismatch")
          subprocess.run(["docker","cp","sql/certs/supabase-root.crt",cid+":/tmp/mf-supabase-root.crt"],check=True)
          root = Path(os.environ["RUNNER_TEMP"]) / "mf_backup"

          tables = [
              "mf_accounts",
              "mf_allocations",
              "mf_audit",
              "mf_beneficiaries",
              "mf_categories",
              "mf_due",
              "mf_events",
              "mf_notifications",
              "mf_obligations",
              "mf_tariffs"
          ]

          envs = [
              "PGHOST",
              "PGPORT",
              "PGUSER",
              "PGDATABASE",
              "PGPASSWORD",
              "PGSSLMODE",
              "PGSSLROOTCERT",
              "PGCONNECT_TIMEOUT"
          ]

          base = ["docker", "exec", "-i"]

          for key in envs:
              base += ["-e", key]

          base += [cid]

          tables = ["public."+t for t in tables] + ["mf_next.accounts","mf_next.movements","mf_next.module_state","mf_next.legacy_imports","mf_next.app_owner","mf_next.feature_flags","mf_next.release_control","mf_next.release_backups"]

          sql = " UNION ALL ".join(
              f"SELECT '{t}', count(*)::text, "
              f"encode(sha256(convert_to("
              f"coalesce(string_agg(to_jsonb(x)::text, "
              f"E'\\n' ORDER BY to_jsonb(x)::text COLLATE \"C\"),"
              f"''),'UTF8')),'hex') "
              f"FROM {t} x"
              for t in tables
          ) + " ORDER BY 1;"

          settings = (
              "SET TIME ZONE 'UTC';\n"
              "SET DateStyle TO 'ISO, YMD';\n"
              "SET extra_float_digits TO 3;\n"
          )

          (root / "integridad.sql").write_text(
              settings + sql + "\n"
          )

          with (root / "snapshot.log").open("w") as log:
              p = subprocess.Popen(
                  base + [
                      "psql", "-X", "-qAt", "-w",
                      "-v", "ON_ERROR_STOP=1"
                  ],
                  stdin=subprocess.PIPE,
                  stdout=subprocess.PIPE,
                  stderr=log,
                  text=True,
                  bufsize=1
              )

              def send(command):
                  p.stdin.write(command + "\n")
                  p.stdin.flush()

              try:
                  send(
                      "BEGIN ISOLATION LEVEL "
                      "REPEATABLE READ READ ONLY;"
                  )

                  send(settings)
                  send("SELECT pg_export_snapshot();")

                  snapshot = p.stdout.readline().strip()

                  if not snapshot:
                      raise RuntimeError(
                          "No se obtuvo snapshot consistente"
                      )

                  with (root / "source.dump").open("wb") as out:
                      subprocess.run(
                          base + [
                              "pg_dump",
                              "--format=custom",
                              "--schema=public",
                              "--schema=mf_next",
                              "--enable-row-security",
                              "--no-password",
                              "--snapshot=" + snapshot
                          ],
                          stdout=out,
                          stderr=log,
                          check=True,
                          timeout=900
                      )

                  send(sql)

                  rows = [
                      p.stdout.readline().strip()
                      for _ in tables
                  ]

                  if any(not row for row in rows):
                      raise RuntimeError(
                          "Inventario de integridad incompleto"
                      )

                  (root / "origen.txt").write_text(
                      "\n".join(rows) + "\n"
                  )

                  send("ROLLBACK;")
                  send("\\q")

                  p.wait(timeout=30)

                  if p.returncode != 0:
                      raise RuntimeError(
                          "Fallo en consulta de integridad"
                      )

              finally:
                  if p.poll() is None:
                      p.terminate()
                      p.wait()

          print("OK: Snapshot consistente generado.")
          print("OK: Huellas de dieciocho tablas calculadas.")
          PY

          mv "$DIR/source.dump" "$FILE"

          test -s "$FILE"

          docker cp "$FILE" \
            "$CONTAINER_ID:/tmp/source.dump"

          docker exec "$CONTAINER_ID" \
            pg_restore --list /tmp/source.dump \
            > "$DIR/inventario.txt"

          grep -q 'FUNCTION public mf_post_basic' \
            "$DIR/inventario.txt"

          grep -q 'FUNCTION public mf_reject_owner_change' \
            "$DIR/inventario.txt"

          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"

          echo "OK: Esquemas public y mf_next respaldados."
          echo "OK: Funciones financieras incluidas."

      - name: Cifrar respaldo
        env:
          BACKUP_KEY: ${{ secrets.MF_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077

          test "${#BACKUP_KEY}" -ge 48

          printf '%s\n' "$BACKUP_KEY" | gpg \
            --batch --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric \
            --cipher-algo AES256 \
            --output "$BACKUP_FILE.gpg" \
            "$BACKUP_FILE"

          test -s "$BACKUP_FILE.gpg"

          echo "OK: Cifrado AES-256 completado."

      - name: Almacenar y recuperar desde Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          python3 <<'PY'
          import os
          import json
          import hashlib
          import urllib.request
          import urllib.parse
          import uuid
          from pathlib import Path

          def request(url, data=None, headers=None):
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers or {}
              )

              with urllib.request.urlopen(
                  req, timeout=120
              ) as response:
                  return response.read()

          form = urllib.parse.urlencode({
              "client_id": os.environ["GOOGLE_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
              "refresh_token": os.environ["GOOGLE_REFRESH_TOKEN"],
              "grant_type": "refresh_token"
          }).encode()

          token = json.loads(request(
              "https://oauth2.googleapis.com/token",
              form
          ))["access_token"]

          auth = {
              "Authorization": "Bearer " + token
          }

          api = "https://www.googleapis.com/drive/v3/files"

          folder_query = urllib.parse.urlencode({
              "q": (
                  "trashed = false and "
                  "mimeType = 'application/vnd.google-apps.folder' "
                  "and name = 'MisFinanzas - Respaldos' "
                  "and appProperties has "
                  "{ key='application' and value='MisFinanzas' }"
              ),
              "fields": "files(id,name),nextPageToken",
              "pageSize": 100
          })

          response = json.loads(request(
              api + "?" + folder_query,
              headers=auth
          ))

          folders = response.get("files", [])

          if len(folders) > 1 or response.get("nextPageToken"):
              raise RuntimeError(
                  "Existen carpetas de respaldo duplicadas."
              )

          if folders:
              folder_id = folders[0]["id"]
          else:
              folder = json.loads(request(
                  api + "?fields=id",
                  json.dumps({
                      "name": "MisFinanzas - Respaldos",
                      "mimeType":
                          "application/vnd.google-apps.folder",
                      "appProperties": {
                          "application": "MisFinanzas"
                      }
                  }).encode(),
                  {
                      **auth,
                      "Content-Type": "application/json"
                  }
              ))

              folder_id = folder["id"]

          file = Path(os.environ["BACKUP_FILE"] + ".gpg")

          content = file.read_bytes()
          boundary = uuid.uuid4().hex

          metadata = json.dumps({
              "name": file.name,
              "mimeType": "application/octet-stream",
              "parents": [folder_id],
              "appProperties": {
                  "application": "MisFinanzas",
                  "type": "encrypted-backup",
                  "format": "financial-public-mf-next-v3"
              }
          }).encode()

          body = (
              f"--{boundary}\r\n"
              "Content-Type: application/json; charset=UTF-8\r\n\r\n"
          ).encode() + metadata + (
              f"\r\n--{boundary}\r\n"
              "Content-Type: application/octet-stream\r\n\r\n"
          ).encode() + content + (
              f"\r\n--{boundary}--\r\n"
          ).encode()

          result = json.loads(request(
              "https://www.googleapis.com/upload/drive/v3/files"
              "?uploadType=multipart&fields=id,name,size",
              body,
              {
                  **auth,
                  "Content-Type":
                      "multipart/related; boundary=" + boundary
              }
          ))

          remote = request(
              api + "/" + result["id"] + "?alt=media",
              headers=auth
          )

          local_hash = hashlib.sha256(content).hexdigest()
          remote_hash = hashlib.sha256(remote).hexdigest()

          if local_hash != remote_hash:
              raise RuntimeError(
                  "El archivo remoto no coincide."
              )

          target = file.parent / "recuperado.gpg"
          target.write_bytes(remote)

          print("OK: Respaldo almacenado en Google Drive.")
          print("OK: Archivo remoto recuperado.")
          print("OK: Integridad SHA-256 verificada.")
          print("Archivo:", file.name)
          print("Bytes:", len(content))
          print("SHA-256:", local_hash)
          PY

      - name: Descifrar archivo recuperado
        env:
          BACKUP_KEY: ${{ secrets.MF_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077

          DIR="$RUNNER_TEMP/mf_backup"

          printf '%s\n' "$BACKUP_KEY" | gpg \
            --batch --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --decrypt \
            --output "$DIR/recuperado.dump" \
            "$DIR/recuperado.gpg"

          cmp "$BACKUP_FILE" "$DIR/recuperado.dump"

          echo "OK: Descifrado e integridad verificados."

      - name: Preparar PostgreSQL aislado
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          docker cp \
            "$RUNNER_TEMP/mf_backup/recuperado.dump" \
            "$CONTAINER_ID:/tmp/recovery.dump"

          docker exec -i "$CONTAINER_ID" \
            psql -X -U postgres -d mf_recovery \
            -v ON_ERROR_STOP=1 <<'SQL'

          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE ROLE mf_backup NOLOGIN;

          CREATE SCHEMA auth;
          CREATE SCHEMA extensions;

          CREATE EXTENSION IF NOT EXISTS pgcrypto
          WITH SCHEMA extensions;

          CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
          WITH SCHEMA extensions;

          CREATE TABLE auth.users (
              id uuid PRIMARY KEY
          );

          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql STABLE
          AS $$
              SELECT NULLIF(
                  current_setting(
                      'request.jwt.claim.sub', true
                  ), ''
              )::uuid
          $$;

          GRANT USAGE ON SCHEMA auth TO authenticated;

          GRANT EXECUTE ON FUNCTION auth.uid()
          TO authenticated;

          DROP SCHEMA public;

          SQL

          echo "OK: Base aislada preparada."

      - name: Restaurar estructura inicial
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          if ! docker exec "$CONTAINER_ID" \
            pg_restore \
              -U postgres \
              -d mf_recovery \
              --section=pre-data \
              --no-owner \
              --no-privileges \
              --exit-on-error \
              --single-transaction \
              /tmp/recovery.dump \
              > "$RUNNER_TEMP/mf_backup/pre.log" 2>&1
          then
            echo "::error::Fallo al restaurar estructura."
            exit 1
          fi

          echo "OK: Estructura inicial restaurada."

      - name: Restaurar registros
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          if ! docker exec "$CONTAINER_ID" \
            pg_restore \
              -U postgres \
              -d mf_recovery \
              --section=data \
              --no-owner \
              --no-privileges \
              --exit-on-error \
              --single-transaction \
              /tmp/recovery.dump \
              > "$RUNNER_TEMP/mf_backup/data.log" 2>&1
          then
            echo "::error::Fallo al restaurar registros."
            exit 1
          fi

          echo "OK: Registros restaurados."

      - name: Reconstruir referencias de propietarios
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          docker exec -i "$CONTAINER_ID" \
            psql -X -U postgres -d mf_recovery \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          DECLARE
              t record;
          BEGIN
              FOR t IN
                  SELECT table_schema,table_name
                  FROM information_schema.columns
                  WHERE table_schema IN ('public','mf_next')
                    AND column_name = 'owner_id'
              LOOP
                  EXECUTE format(
                      'INSERT INTO auth.users(id)
                       SELECT DISTINCT owner_id
                       FROM %I.%I
                       WHERE owner_id IS NOT NULL
                       ON CONFLICT DO NOTHING',
                      t.table_schema,t.table_name
                  );
              END LOOP;
          END $$;

          SQL

          echo "OK: Referencias reconstruidas."
          echo "No se copiaron credenciales de autenticacion."

      - name: Restaurar restricciones y seguridad
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          if ! docker exec "$CONTAINER_ID" \
            pg_restore \
              -U postgres \
              -d mf_recovery \
              --section=post-data \
              --no-owner \
              --no-privileges \
              --exit-on-error \
              --single-transaction \
              /tmp/recovery.dump \
              > "$RUNNER_TEMP/mf_backup/post.log" 2>&1
          then
            echo "::error::Fallo en restricciones o dependencias."
            exit 1
          fi

          echo "OK: Triggers, indices y restricciones restaurados."

      - name: Validar integridad estructural
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          docker exec -i "$CONTAINER_ID" \
            psql -X -U postgres -d mf_recovery \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          DECLARE
              t text;
              n bigint;
          BEGIN
              FOREACH t IN ARRAY ARRAY[
                  'mf_accounts',
                  'mf_allocations',
                  'mf_audit',
                  'mf_beneficiaries',
                  'mf_categories',
                  'mf_due',
                  'mf_events',
                  'mf_notifications',
                  'mf_obligations',
                  'mf_tariffs'
              ]
              LOOP
                  IF to_regclass('public.' || t) IS NULL THEN
                      RAISE EXCEPTION 'Tabla faltante: %', t;
                  END IF;

                  EXECUTE format(
                      'SELECT count(*) FROM public.%I', t
                  ) INTO n;

                  RAISE NOTICE 'Tabla consultable: %', t;
              END LOOP;

              IF (
                  SELECT count(*)
                  FROM pg_proc p
                  JOIN pg_namespace s
                    ON s.oid = p.pronamespace
                  WHERE s.nspname = 'public'
                    AND p.proname IN (
                        'mf_post_basic',
                        'mf_reject_owner_change'
                    )
              ) <> 2 THEN
                  RAISE EXCEPTION 'Funciones incompletas';
              END IF;

              IF (
                  SELECT count(*)
                  FROM pg_trigger t
                  JOIN pg_class c ON c.oid = t.tgrelid
                  JOIN pg_namespace s ON s.oid = c.relnamespace
                  WHERE s.nspname = 'public'
                    AND NOT t.tgisinternal
                    AND t.tgname = 'protect_owner'
                    AND t.tgenabled IN ('O', 'A')
              ) <> 6 THEN
                  RAISE EXCEPTION 'Triggers incompletos';
              END IF;

              IF (
                  SELECT count(*)
                  FROM pg_policies
                  WHERE schemaname = 'public'
                    AND left(tablename, 3) = 'mf_'
              ) <> 20 THEN
                  RAISE EXCEPTION 'Politicas RLS incompletas';
              END IF;

              IF (
                  SELECT count(*)
                  FROM pg_constraint c
                  JOIN pg_namespace s
                    ON s.oid = c.connamespace
                  WHERE s.nspname = 'public'
                    AND c.contype = 'f'
                    AND c.convalidated
              ) <> 20 THEN
                  RAISE EXCEPTION 'Claves foraneas incompletas';
              END IF;

              IF (
                  SELECT count(*)
                  FROM pg_class c
                  JOIN pg_namespace s
                    ON s.oid = c.relnamespace
                  WHERE s.nspname = 'public'
                    AND c.relkind = 'r'
                    AND left(c.relname, 3) = 'mf_'
                    AND c.relrowsecurity
              ) <> 10 THEN
                  RAISE EXCEPTION
                      'RLS no esta activo en todas las tablas';
              END IF;

              IF to_regclass(
                  'public.mf_audit_id_seq'
              ) IS NULL THEN
                  RAISE EXCEPTION 'Secuencia faltante';
              END IF;
          END $$;

          SQL

          echo "OK: Integridad estructural comprobada."

      - name: Comparar integridad origen y destino
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          umask 077

          DIR="$RUNNER_TEMP/mf_backup"

          docker exec -i "$CONTAINER_ID" \
            psql -X -qAt -U postgres \
            -d mf_recovery \
            -v ON_ERROR_STOP=1 \
            < "$DIR/integridad.sql" \
            > "$DIR/destino.txt" \
            2> "$DIR/integridad.log"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "mf_backup"

          expected = {
              "mf_accounts",
              "mf_allocations",
              "mf_audit",
              "mf_beneficiaries",
              "mf_categories",
              "mf_due",
              "mf_events",
              "mf_notifications",
              "mf_obligations",
              "mf_tariffs"
          }

          expected={"public."+t for t in expected} | set(["mf_next.accounts","mf_next.movements","mf_next.module_state","mf_next.legacy_imports","mf_next.app_owner","mf_next.feature_flags","mf_next.release_control","mf_next.release_backups"])

          def read(name):
              result = {}

              for line in (root / name).read_text().splitlines():
                  table, count, digest = line.split("|")

                  if table in result:
                      raise RuntimeError("Tabla duplicada")

                  if not re.fullmatch(r"[0-9a-f]{64}", digest):
                      raise RuntimeError("Huella invalida")

                  result[table] = (int(count), digest)

              return result

          source = read("origen.txt")
          target = read("destino.txt")

          if set(source) != expected or set(target) != expected:
              raise RuntimeError("Inventario incompleto")

          failed = []

          for table in sorted(expected):
              if source[table] == target[table]:
                  print("OK:", table)
              else:
                  print("ERROR:", table)
                  failed.append(table)

          if failed:
              raise RuntimeError(
                  "Diferencias de integridad detectadas"
              )

          print("OK: Las diez tablas coinciden.")
          print("OK: Cantidad y contenido verificados.")
          PY

      - name: Probar triggers recuperados
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          docker exec -i "$CONTAINER_ID" \
            psql -X -U postgres -d mf_recovery \
            -v ON_ERROR_STOP=1 <<'SQL'

          BEGIN;

          DO $$
          DECLARE
              t text;
              n bigint;
              rejected boolean;
              test_owner uuid := gen_random_uuid();
          BEGIN
              INSERT INTO auth.users(id)
              VALUES (test_owner);

              FOREACH t IN ARRAY ARRAY[
                  'mf_accounts',
                  'mf_beneficiaries',
                  'mf_categories',
                  'mf_notifications',
                  'mf_obligations',
                  'mf_tariffs'
              ]
              LOOP
                  EXECUTE format(
                      'UPDATE public.%I SET owner_id = owner_id',
                      t
                  );

                  GET DIAGNOSTICS n = ROW_COUNT;

                  IF n = 0 THEN
                      RAISE NOTICE
                          'SIN DATOS PARA PRUEBA: %', t;
                  ELSE
                      RAISE NOTICE
                          'ACTUALIZACION VALIDA: %', t;

                      rejected := false;

                      BEGIN
                          EXECUTE format(
                              'UPDATE public.%I
                               SET owner_id = $1
                               WHERE owner_id IS DISTINCT FROM $1',
                              t
                          ) USING test_owner;

                      EXCEPTION WHEN raise_exception THEN
                          IF SQLERRM =
                              'No se permite modificar el propietario'
                          THEN
                              rejected := true;
                          ELSE
                              RAISE;
                          END IF;
                      END;

                      IF NOT rejected THEN
                          RAISE EXCEPTION
                              'Cambio de propietario permitido: %',
                              t;
                      END IF;

                      RAISE NOTICE
                          'PROPIETARIO PROTEGIDO: %', t;
                  END IF;
              END LOOP;

              IF EXISTS (
                  SELECT 1 FROM public.mf_accounts
              ) THEN

                  rejected := false;

                  BEGIN
                      UPDATE public.mf_accounts
                      SET opening = CASE
                          WHEN opening = 0 THEN 1
                          ELSE 0
                      END;

                  EXCEPTION WHEN raise_exception THEN
                      IF SQLERRM =
                          'No se permite modificar el saldo inicial de una cuenta existente'
                      THEN
                          rejected := true;
                      ELSE
                          RAISE;
                      END IF;
                  END;

                  IF NOT rejected THEN
                      RAISE EXCEPTION
                          'Cambio de saldo inicial permitido';
                  END IF;

                  RAISE NOTICE 'SALDO INICIAL PROTEGIDO';

                  rejected := false;

                  BEGIN
                      UPDATE public.mf_accounts
                      SET kind = CASE
                          WHEN kind = 'asset' THEN 'qa_invalid'
                          ELSE 'asset'
                      END;

                  EXCEPTION WHEN raise_exception THEN
                      IF SQLERRM =
                          'No se permite modificar el tipo de una cuenta existente'
                      THEN
                          rejected := true;
                      ELSE
                          RAISE;
                      END IF;
                  END;

                  IF NOT rejected THEN
                      RAISE EXCEPTION
                          'Cambio de tipo de cuenta permitido';
                  END IF;

                  RAISE NOTICE 'TIPO DE CUENTA PROTEGIDO';

              ELSE
                  RAISE NOTICE
                      'SIN CUENTAS PARA PRUEBAS ESPECIFICAS';
              END IF;

          END $$;

          ROLLBACK;

          SQL

          echo "OK: Pruebas disponibles de triggers ejecutadas."

      - name: Probar aislamiento entre propietarios
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          docker exec -i "$CONTAINER_ID" \
            psql -X -U postgres -d mf_recovery \
            -v ON_ERROR_STOP=1 <<'SQL'

          BEGIN;

          GRANT USAGE ON SCHEMA public TO authenticated;

          GRANT SELECT ON ALL TABLES IN SCHEMA public
          TO authenticated;

          INSERT INTO auth.users(id)
          VALUES
              ('11111111-1111-4111-8111-111111111111'),
              ('22222222-2222-4222-8222-222222222222');

          INSERT INTO public.mf_accounts (
              id,
              owner_id,
              name,
              kind,
              currency,
              opening
          )
          VALUES (
              gen_random_uuid(),
              '11111111-1111-4111-8111-111111111111',
              'QA Cuenta A',
              'asset',
              'COP',
              1000
          ), (
              gen_random_uuid(),
              '22222222-2222-4222-8222-222222222222',
              'QA Cuenta B',
              'asset',
              'COP',
              2000
          );

          SET LOCAL ROLE authenticated;

          SELECT set_config(
              'request.jwt.claim.sub',
              '11111111-1111-4111-8111-111111111111',
              true
          );

          DO $$
          DECLARE
              t text;
              n bigint;
          BEGIN
              FOREACH t IN ARRAY ARRAY[
                  'mf_accounts',
                  'mf_allocations',
                  'mf_audit',
                  'mf_beneficiaries',
                  'mf_categories',
                  'mf_due',
                  'mf_events',
                  'mf_notifications',
                  'mf_obligations',
                  'mf_tariffs'
              ]
              LOOP
                  EXECUTE format(
                      'SELECT count(*) FROM public.%I
                       WHERE owner_id IS DISTINCT FROM auth.uid()',
                      t
                  ) INTO n;

                  IF n <> 0 THEN
                      RAISE EXCEPTION
                          'Fallo de aislamiento RLS: %', t;
                  END IF;

                  RAISE NOTICE 'RLS AISLADO: %', t;
              END LOOP;

              SELECT count(*) INTO n
              FROM public.mf_accounts
              WHERE name = 'QA Cuenta A';

              IF n <> 1 THEN
                  RAISE EXCEPTION
                      'No se puede consultar cuenta propia';
              END IF;

              SELECT count(*) INTO n
              FROM public.mf_accounts
              WHERE name = 'QA Cuenta B';

              IF n <> 0 THEN
                  RAISE EXCEPTION
                      'Se puede consultar cuenta ajena';
              END IF;

              RAISE NOTICE 'ACCESO PROPIO CORRECTO';
              RAISE NOTICE 'ACCESO AJENO BLOQUEADO';
          END $$;

          RESET ROLE;

          ROLLBACK;

          SQL

          echo "OK: Aislamiento RLS verificado."
          echo "OK: Registros sinteticos descartados."

