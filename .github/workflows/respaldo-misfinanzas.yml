
name: Respaldo MisFinanzas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: respaldo-misfinanzas
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      PGHOST: aws-0-sa-east-1.pooler.supabase.com
      PGPORT: "5432"
      PGUSER: mf_backup.yjzgpspxvmimduuemxms
      PGDATABASE: postgres
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "15"
      BACKUP_KEY: ${{ secrets.MF_BACKUP_ENCRYPTION_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

    steps:
      - name: Preparar herramientas
        run: |
          set -euo pipefail

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          . /etc/os-release

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update -qq

          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y postgresql-client-17

          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

          pg_dump --version
          pg_restore --version
          gpg --version

          pg_dump --version | grep -E 'PostgreSQL\) 17\.'

          echo "OK: PostgreSQL 17 disponible."

      - name: Validar configuracion
        run: |
          set -euo pipefail

          test -n "$PGPASSWORD"
          test "${#BACKUP_KEY}" -ge 48
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$GOOGLE_REFRESH_TOKEN"

          psql -X -w -v ON_ERROR_STOP=1 \
            -c "BEGIN READ ONLY; SELECT current_user, current_setting('server_version'); ROLLBACK;"

          echo "OK: Configuracion validada."

      - name: Generar y cifrar respaldo
        run: |
          set -euo pipefail
          umask 077

          DIR="$RUNNER_TEMP/mf_backup"
          mkdir -p "$DIR"

          FILE="$DIR/MisFinanzas_$(date -u +%Y%m%dT%H%M%SZ).dump"

          pg_dump \
            --format=custom \
            --enable-row-security \
            --no-owner \
            --no-privileges \
            --no-password \
            --table=public.mf_accounts \
            --table=public.mf_allocations \
            --table=public.mf_audit \
            --table=public.mf_beneficiaries \
            --table=public.mf_categories \
            --table=public.mf_due \
            --table=public.mf_events \
            --table=public.mf_notifications \
            --table=public.mf_obligations \
            --table=public.mf_tariffs \
            --file="$FILE"

          test -s "$FILE"

          pg_restore --list "$FILE" > /dev/null

          printf '%s\n' "$BACKUP_KEY" | gpg \
            --batch --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric \
            --cipher-algo AES256 \
            --output "$FILE.gpg" \
            "$FILE"

          test -s "$FILE.gpg"

          printf '%s\n' "$BACKUP_KEY" | gpg \
            --batch --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --decrypt \
            --output "$DIR/verificacion.dump" \
            "$FILE.gpg"

          cmp "$FILE" "$DIR/verificacion.dump"

          rm -f "$FILE" "$DIR/verificacion.dump"

          echo "BACKUP_FILE=$FILE.gpg" >> "$GITHUB_ENV"

          echo "OK: Respaldo generado."
          echo "OK: Cifrado AES-256 completado."
          echo "OK: Descifrado e integridad local verificados."

      - name: Transferir y verificar Google Drive
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json
          import hashlib
          import urllib.request
          import urllib.parse
          import uuid
          from pathlib import Path

          def request(url, data=None, headers=None):
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers or {}
              )
              with urllib.request.urlopen(
                  req, timeout=120
              ) as response:
                  return response.read()

          form = urllib.parse.urlencode({
              "client_id": os.environ["GOOGLE_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
              "refresh_token": os.environ["GOOGLE_REFRESH_TOKEN"],
              "grant_type": "refresh_token"
          }).encode()

          token = json.loads(request(
              "https://oauth2.googleapis.com/token",
              form
          ))["access_token"]

          auth = {
              "Authorization": "Bearer " + token
          }

          file = Path(os.environ["BACKUP_FILE"])
          content = file.read_bytes()

          boundary = uuid.uuid4().hex

          metadata = json.dumps({
              "name": file.name,
              "mimeType": "application/octet-stream",
              "appProperties": {
                  "application": "MisFinanzas",
                  "type": "encrypted-backup"
              }
          }).encode()

          body = (
              f"--{boundary}\r\n"
              "Content-Type: application/json; charset=UTF-8\r\n\r\n"
          ).encode() + metadata + (
              f"\r\n--{boundary}\r\n"
              "Content-Type: application/octet-stream\r\n\r\n"
          ).encode() + content + (
              f"\r\n--{boundary}--\r\n"
          ).encode()

          result = json.loads(request(
              "https://www.googleapis.com/upload/drive/v3/files"
              "?uploadType=multipart&fields=id,name,size",
              body,
              {
                  **auth,
                  "Content-Type":
                      "multipart/related; boundary=" + boundary
              }
          ))

          remote = request(
              "https://www.googleapis.com/drive/v3/files/"
              + result["id"] + "?alt=media",
              headers=auth
          )

          local_hash = hashlib.sha256(content).hexdigest()
          remote_hash = hashlib.sha256(remote).hexdigest()

          if local_hash != remote_hash:
              raise RuntimeError(
                  "ERROR: El archivo remoto no coincide."
              )

          print("OK: Archivo almacenado en Google Drive.")
          print("OK: Integridad remota SHA-256 verificada.")
          print("Archivo:", file.name)
          print("Bytes:", len(content))
          print("SHA-256:", local_hash)
          PY

      - name: Limpiar archivos temporales
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/mf_backup"
