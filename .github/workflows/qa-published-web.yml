name: Verify published MisFinanzas HTTPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-published-web.yml']
permissions:
  contents: read
jobs:
  https-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node tools/qa-published-web.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-web-${{ github.sha }}
          path: evidence/published-web.json
          retention-days: 30
  android-download:
    needs: https-delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Deliver the existing approved signed APK; never rebuild or replace a release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 0dd1e1642a2337e5bca1da89cb4008be76293ca4 10eb3780da53acb686fda75a5e965eb13793a3ff
          git diff --exit-code 0dd1e1642a2337e5bca1da89cb4008be76293ca4 10eb3780da53acb686fda75a5e965eb13793a3ff -- web android/app/src/main android/app/build.gradle.kts package.json
          dir="$RUNNER_TEMP/mf-signed-delivery"
          mkdir -p "$dir"
          gh run download 46043307612 --repo "$GITHUB_REPOSITORY" --name signed-android-0dd1e1642a2337e5bca1da89cb4008be76293ca4 --dir "$dir"
          cd "$dir"
          printf '%s\n' 'b1ec9a558403a2cca8dc8e8313f32bda6f51568503db11d974129a103bbdadb8  MisFinanzas-2.7.0-signed.apk' | sha256sum -c -
          test "$(tr -d '\r\n' < COMMIT.txt)" = '0dd1e1642a2337e5bca1da89cb4008be76293ca4'
          cat > RELEASE_NOTES.md <<'NOTES'
          MisFinanzas 2.7.0 para web y Android, con datos de prueba para aceptación del titular.

          Web: https://eneicor-lab.github.io/misfinanzas-web/

          APK integral firmada, versión 2.7.0/código29, con el firmante e ícono existentes. Se entrega el mismo binario aprobado, sin nueva compilación.

          Lanzar definitiva requiere la decisión y confirmación del titular; publicar o instalar no elimina datos ni usuarios. Conservar las copias cifradas y completar la aceptación antes de esa transición.

          Validaciones: 14 casos focalizados de transición, respaldo cifrado y restauración comparada de18tablas, y carga HTTPS observada en escritorio/móvil. Las pruebas funcionales y nativas anteriores se reutilizan según sus fuentes sin cambios. La aceptación autenticada del titular es distinta de esta comprobación de entrega.

          APK fuente: 0dd1e1642a2337e5bca1da89cb4008be76293ca4. Fuente integrada de aplicación idéntica: 10eb3780da53acb686fda75a5e965eb13793a3ff.
          NOTES
          gh release create v2.7.0 MisFinanzas-2.7.0-signed.apk SHA256SUMS.txt COMMIT.txt SIGNATURE.txt --repo "$GITHUB_REPOSITORY" --target 10eb3780da53acb686fda75a5e965eb13793a3ff --title 'MisFinanzas 2.7.0 — Web y Android' --notes-file RELEASE_NOTES.md
